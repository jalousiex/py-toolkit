[project]
name = "small_toolkit"
version = "0.1.2"
description = "纯标准库的通用小工具：产物目录、日志初始化、命令行参数与终端表格"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/jalousiex/py-small_toolkit"
Repository = "https://github.com/jalousiex/py-small_toolkit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["small_toolkit"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
